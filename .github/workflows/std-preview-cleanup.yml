# Managed by the standards pack, shipped to repositories with a Worker (a root wrangler config). Workers Builds keeps
# every branch's Preview until the Worker's Preview limit evicts the oldest, so a closed pull request's Preview is
# deleted here (merged or not), and a weekly sweep deletes any left behind (pull requests closed in the last 30 days,
# except branches an open pull request still uses). The Cloudflare token is read at runtime from the org's CI 1Password
# vault (the overlay's preview.cleanup refs, through the org secret OP_SERVICE_ACCOUNT_TOKEN), never stored in GitHub;
# while the overlay sets no preview.cleanup it only posts a notice. Not a required check.
name: std-preview-cleanup
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: std-preview-cleanup-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ${{ vars.STD_GATE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      # the default branch's reviewed code and settings, never a closed pull request's, before any credential is loaded
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: settings
        id: cfg
        run: node -e 'const c=require("./scripts/agent/pack.json").preview?.cleanup;console.log("token_ref="+(c?.token_ref??""));console.log("account_ref="+(c?.account_ref??""))' >>"$GITHUB_OUTPUT"
      - name: inert
        if: steps.cfg.outputs.token_ref == ''
        run: echo "::notice::PR Previews were not cleaned up; the org overlay sets no preview.cleanup yet (needs the CI-only 1Password service account and a previews-scoped Cloudflare token)"
      - name: token
        if: steps.cfg.outputs.token_ref != ''
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ steps.cfg.outputs.token_ref }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cfg.outputs.account_ref }}
      - name: closed pull request
        # a fork's branch never had a Preview here; its name could match one of this repository's branches
        if: steps.cfg.outputs.token_ref != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent/release.mjs cleanup --pr-branch "$HEAD_REF"
      - name: sweep
        if: steps.cfg.outputs.token_ref != '' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent/release.mjs cleanup --sweep
