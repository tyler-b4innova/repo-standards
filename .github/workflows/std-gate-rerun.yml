# Managed by the standards pack. Two events re-gate a pull request without a push, and no others (comments never do;
# the Codex verdict is re-checked by scripts/agent/verdict-recheck, which the org's launcher or merge helper calls):
# - a person's approval or a dismissal: re-run the head's gate run, which reuses its build (promotion design sign-off);
# - a base change: dispatch std-gate on the fresh merge ref.
# Not a required check. No concurrency group: a cancelled run would stay on the PR as a failed check.
name: std-gate-rerun
on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request:
    types: [edited]
permissions:
  actions: write
  contents: read
  pull-requests: read
jobs:
  rerun:
    if: >-
      (github.event_name == 'pull_request_review' && github.event.sender.type != 'Bot' &&
       (github.event.review.state == 'approved' || github.event.action == 'dismissed')) ||
      (github.event_name == 'pull_request' && github.event.changes.base)
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      EVENT: ${{ github.event_name }}
    steps:
      # A gate run in flight that has not reached its evidence step reads the approval itself, so this exits at once.
      # Only an approval that lands after that step waits (unavoidably billed; approvals are rare) for the run to end.
      - run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions"
          if [ "$EVENT" = pull_request ]; then
            # The dispatch runs on the head branch, so the check lands on the head SHA; a fork's branch is not here.
            [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] || { echo "base changed on a fork's pull request: push to re-gate it"; exit 0; }
            echo "base changed: re-gating #$PR on its new merge ref"
            gh workflow run std-gate.yml -R "$GITHUB_REPOSITORY" --ref "$HEAD_REF" -f pr="$PR"
            exit 0
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          run=$(gh api "$api/workflows/std-gate.yml/runs?head_sha=$sha&per_page=20" --jq "[.workflow_runs[] | select(.event == \"pull_request\" or .event == \"workflow_dispatch\")][0] // empty | \"\\(.id) \\(.status)\"")
          [ -n "$run" ] || { echo "no gate run for $sha yet"; exit 0; }
          read -r id status <<<"$run"
          if [ "$status" != completed ]; then
            ev=$(gh api "$api/runs/$id/jobs" --jq '[.jobs[] | select(.name == "gate") | .steps[] | select(.name == "evidence") | .status][0] // "pending"')
            [ "$ev" = completed ] || { echo "gate run $id is $status and has not read approvals yet; it reads this one itself"; exit 0; }
            echo "gate run $id already read approvals; waiting for it to finish, then re-running"
            for i in $(seq 30); do sleep 30; [ "$(gh api "$api/runs/$id" --jq .status)" = completed ] && break; done
          fi
          echo "re-running gate run $id for ${sha:0:7} (reuses its build)"
          gh api -X POST "$api/runs/$id/rerun" >/dev/null && exit 0
          [ "$(gh api "$api/runs/$id" --jq .status)" != completed ] || exit 1
          echo "another event re-ran gate run $id first"
