# Managed by the standards pack, shipped to every repository with a Worker and a standards.json staging_url (and to
# one that names extra browsers). Pull requests run the affected tests in Chromium against their preview; a merge to
# main deploys the staging Preview and uploads the production version, and the completion of that deploy's Workers
# Builds check-run (on the default branch) starts this: the repo's FULL suite (e2e and scripts/agent/gate.local.sh),
# every configured browser, against staging (standards.json staging_url), once per commit, posted as the check-run
# `release-check` on the commit that was built. The production deploy waits for that check to succeed. A repository
# whose staging is not deployed by Workers Builds never starts it. The commit under test is the check-run's head_sha,
# not GITHUB_SHA (the default branch's tip on a check_run event). Never scheduled; the timeout is runaway protection
# only, not a quality signal. Not a required check.
name: std-release-check
on:
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to release-check (a manual rerun)"
        required: true
permissions:
  actions: write # cancels the run when a newer commit replaces staging, or there is nothing to certify
  checks: write # posts the check-run release-check on the commit under test
  contents: read
jobs:
  release:
    name: release
    # only the Cloudflare App's Workers Builds completions on the default branch: any other check-run (or another App's check
    # of the same name) starts no job (no runner, nothing billed)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.check_run.check_suite.app.slug == '{check_app}' && startsWith(github.event.check_run.name, '{check_name}') && github.event.check_run.check_suite.head_branch == github.event.repository.default_branch) }}
    # one run per commit: with several Workers the last build completion wins and earlier runs cancel. A job-level group is
    # taken only by a job that runs, so unrelated check-runs on the same commit cancel nothing.
    concurrency:
      group: std-release-check-${{ github.event.check_run.head_sha || inputs.sha }}
      cancel-in-progress: true
    env:
      RELEASE_SHA: ${{ github.event.check_run.head_sha || inputs.sha }}
    runs-on: ${{ vars.STD_GATE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }} # the commit that was built, not the default branch's tip
          fetch-depth: 0 # the parent (what the commit changed) and the later commits (whether one superseded it)
          persist-credentials: false
      - name: package manager
        id: pm
        # the lockfile's package manager caches (pnpm and yarn run through corepack; no cache if that fails)
        run: |
          if [ -f pnpm-lock.yaml ]; then if corepack enable && pnpm --version >/dev/null; then echo cache=pnpm >>"$GITHUB_OUTPUT"; fi
          elif [ -f yarn.lock ]; then if corepack enable && yarn --version >/dev/null; then echo cache=yarn >>"$GITHUB_OUTPUT"; fi
          elif [ -f package-lock.json ]; then echo cache=npm >>"$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ${{ steps.pm.outputs.cache }}
      - name: release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent/gate.mjs release
      - name: install
        if: steps.release.outputs.skip != 'true'
        env:
          GATE_BROWSERS: ${{ steps.release.outputs.browsers }}
        run: node scripts/agent/gate.mjs install
      - name: e2e
        if: steps.release.outputs.skip != 'true'
        env:
          GATE_BROWSERS: ${{ steps.release.outputs.browsers }}
          GATE_PREVIEW_URL: ${{ steps.release.outputs.url }}
          GATE_SELECT: "full"
          RELEASE_CHECK: "1"
        run: node scripts/agent/gate.mjs e2e --release
      - name: repo checks
        if: steps.release.outputs.skip != 'true'
        env:
          GATE_BROWSERS: ${{ steps.release.outputs.browsers }}
          GATE_PREVIEW_URL: ${{ steps.release.outputs.url }}
          BASE_URL: ${{ steps.release.outputs.url }}
          PLAYWRIGHT_BASE_URL: ${{ steps.release.outputs.url }}
          GATE_SELECT: "full"
          RELEASE_CHECK: "1"
        run: |
          if [ -f scripts/agent/gate.local.sh ]; then bash scripts/agent/gate.local.sh; else echo "notice: no scripts/agent/gate.local.sh"; fi
      - name: still staging
        # runs after a failing suite too: a failure caused by a newer commit's deployment cancels the run (neither a pass nor a
        # red failure for this commit), while a failure with this commit still current stays red
        if: ${{ !cancelled() && steps.release.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent/gate.mjs release-verify
      - name: report
        # the job's own check-run lands on the default branch's tip, so the verdict is posted on the commit that was built
        if: ${{ !cancelled() && steps.release.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_JOB_STATUS: ${{ job.status }}
        run: node scripts/agent/gate.mjs release-report
