# Managed by the standards pack, shipped to every repository with a Worker and a standards.json staging_url (and to
# one that names extra browsers). Pull requests run the affected tests in Chromium against their preview; a merge to
# main deploys the staging Preview and uploads the production version, and this runs the repo's FULL suite (e2e and
# scripts/agent/gate.local.sh), every configured browser, against staging (standards.json staging_url) once, as the
# check-run `release-check` on the merge commit. The production deploy waits for that check to succeed. A push of only
# non-deployable paths skips the suite. Never scheduled; one run per commit; the timeout is runaway protection only,
# not a quality signal. Not a required check.
name: std-release-check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: write # cancels the run when a newer commit replaces staging
  checks: read
  contents: read
concurrency:
  group: std-release-check-${{ github.sha }}
  cancel-in-progress: true
jobs:
  release-check:
    name: release-check
    runs-on: ${{ vars.STD_GATE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the push's before commit (what the push changed) and the parent (whether a Workers Builds check is still to come)
          persist-credentials: false
      - name: package manager
        id: pm
        # the lockfile's package manager caches (pnpm and yarn run through corepack; no cache if that fails)
        run: |
          if [ -f pnpm-lock.yaml ]; then if corepack enable && pnpm --version >/dev/null; then echo cache=pnpm >>"$GITHUB_OUTPUT"; fi
          elif [ -f yarn.lock ]; then if corepack enable && yarn --version >/dev/null; then echo cache=yarn >>"$GITHUB_OUTPUT"; fi
          elif [ -f package-lock.json ]; then echo cache=npm >>"$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ${{ steps.pm.outputs.cache }}
      - name: release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent/gate.mjs release
      - name: install
        if: steps.release.outputs.skip != 'true'
        env:
          GATE_BROWSERS: ${{ steps.release.outputs.browsers }}
        run: node scripts/agent/gate.mjs install
      - name: e2e
        if: steps.release.outputs.skip != 'true'
        env:
          GATE_BROWSERS: ${{ steps.release.outputs.browsers }}
          GATE_PREVIEW_URL: ${{ steps.release.outputs.url }}
          GATE_SELECT: "full"
          RELEASE_CHECK: "1"
        run: node scripts/agent/gate.mjs e2e --release
      - name: repo checks
        if: steps.release.outputs.skip != 'true'
        env:
          GATE_BROWSERS: ${{ steps.release.outputs.browsers }}
          GATE_PREVIEW_URL: ${{ steps.release.outputs.url }}
          BASE_URL: ${{ steps.release.outputs.url }}
          PLAYWRIGHT_BASE_URL: ${{ steps.release.outputs.url }}
          GATE_SELECT: "full"
          RELEASE_CHECK: "1"
        run: |
          if [ -f scripts/agent/gate.local.sh ]; then bash scripts/agent/gate.local.sh; else echo "notice: no scripts/agent/gate.local.sh"; fi
      - name: still staging
        # the suite certifies this commit only if staging still served its deployment
        if: steps.release.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent/gate.mjs release-verify
