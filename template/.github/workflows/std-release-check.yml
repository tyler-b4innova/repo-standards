# Managed by the standards pack, shipped to every repository with a Worker and a standards.json staging_url (and to
# one that names extra browsers). Pull requests run the affected tests in Chromium against their preview; a merge to
# main deploys the staging Preview and uploads the production version. This runs only before a production promotion,
# the same for every repository: whatever promotes a version (the portal's Releases approval, or the agent deploy) starts
# it with `workflow_dispatch` and that version's commit as `sha`, and waits for the check-run `release-check` on that
# commit. Three jobs, so no code from the dispatched commit ever holds a write token:
#   pre    (trusted: the default branch's workflow and scripts) checks the sha is on the default branch BEFORE anything of
#          it is checked out, creates the verdict check-run `release-check` (in_progress) on it, waits for the commit's
#          Workers Builds, and cancels the run when it is superseded or there is nothing to certify;
#   suite  (untrusted, contents: read only) checks out the sha and runs the repo's FULL suite (e2e and
#          scripts/agent/gate.local.sh), every configured browser, against staging (standards.json staging_url);
#   post   (trusted) re-checks supersession, then completes the verdict once: success or failure from the suite's result.
# Never started by a push, a check-run or a schedule; the timeouts are runaway protection only, not a quality signal.
# Not a required check.
name: std-release-check
run-name: release-check ${{ inputs.sha }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The version's commit to release-check: its full 40-character lowercase hex sha, reachable from the default branch"
        required: true
permissions:
  contents: read
# one run per commit: a second dispatch for the same commit cancels the first
concurrency:
  group: std-release-check-${{ inputs.sha }}
  cancel-in-progress: true
env:
  RELEASE_SHA: ${{ inputs.sha }}
jobs:
  pre:
    name: pre
    runs-on: ${{ vars.STD_GATE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      actions: write # cancels the run when a newer commit replaces staging, or there is nothing to certify
      checks: write # creates and completes the check-run release-check on the commit
      contents: read
    outputs:
      check_id: ${{ steps.start.outputs.check_id }}
      browsers: ${{ steps.release.outputs.browsers }}
      url: ${{ steps.release.outputs.url }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - name: sha
        # fail fast and plainly before anything is checked out or created
        run: |
          case "$RELEASE_SHA" in *[!0123456789abcdef]* | "") bad=1 ;; *) [ "${#RELEASE_SHA}" -eq 40 ] || bad=1 ;; esac
          if [ -n "${bad:-}" ]; then echo "::error::release-check needs the version's full 40-character lowercase hex commit sha (got '$RELEASE_SHA')"; exit 1; fi
      - name: ref
        # a workflow_dispatch runs the YAML of the ref it was dispatched on: refuse unless that is the default branch (an honest
        # guard; a consumer's proof is the rule in the README: dispatch event, default-branch head_branch, this workflow's path)
        env:
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "$DEFAULT_REF" ]; then echo "::error::release-check runs only from the default branch's workflow (dispatched on $GITHUB_REF, need $DEFAULT_REF)"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }} # trusted: nothing of the dispatched commit runs in this job
          fetch-depth: 0
          persist-credentials: false
      - name: default branch
        # plain shell, before the sha is checked out or any of its code runs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::${RELEASE_SHA:0:7} is not on the default branch ($DEFAULT_BRANCH); a release-check certifies only a commit that it contains"; exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: start
        id: start
        # the verdict check-run exists, in_progress, on the sha
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent/gate.mjs release-start
      - name: release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent/gate.mjs release
  suite:
    name: suite
    needs: pre
    if: ${{ needs.pre.result == 'success' && needs.pre.outputs.skip != 'true' }}
    runs-on: ${{ vars.STD_GATE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read # nothing else: the dispatched commit's code holds no write token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }} # the commit that was built, not the default branch's tip
          fetch-depth: 0
          persist-credentials: false
      - name: package manager
        id: pm
        # the lockfile's package manager caches (pnpm and yarn run through corepack; no cache if that fails)
        run: |
          if [ -f pnpm-lock.yaml ]; then if corepack enable && pnpm --version >/dev/null; then echo cache=pnpm >>"$GITHUB_OUTPUT"; fi
          elif [ -f yarn.lock ]; then if corepack enable && yarn --version >/dev/null; then echo cache=yarn >>"$GITHUB_OUTPUT"; fi
          elif [ -f package-lock.json ]; then echo cache=npm >>"$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ${{ steps.pm.outputs.cache }}
      - name: install
        env:
          GATE_BROWSERS: ${{ needs.pre.outputs.browsers }}
        run: node scripts/agent/gate.mjs install
      - name: e2e
        env:
          GATE_BROWSERS: ${{ needs.pre.outputs.browsers }}
          GATE_PREVIEW_URL: ${{ needs.pre.outputs.url }}
          GATE_SELECT: "full"
          RELEASE_CHECK: "1"
        run: node scripts/agent/gate.mjs e2e --release
      - name: repo checks
        env:
          GATE_BROWSERS: ${{ needs.pre.outputs.browsers }}
          GATE_PREVIEW_URL: ${{ needs.pre.outputs.url }}
          BASE_URL: ${{ needs.pre.outputs.url }}
          PLAYWRIGHT_BASE_URL: ${{ needs.pre.outputs.url }}
          GATE_SELECT: "full"
          RELEASE_CHECK: "1"
        run: |
          if [ -f scripts/agent/gate.local.sh ]; then bash scripts/agent/gate.local.sh; else echo "notice: no scripts/agent/gate.local.sh"; fi
  post:
    name: post
    needs: [pre, suite]
    # runs after a failing, skipped or cancelled suite too, whenever the verdict check-run exists
    if: ${{ always() && needs.pre.outputs.check_id != '' }}
    runs-on: ${{ vars.STD_GATE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      actions: write
      checks: write
      contents: read
    env:
      RELEASE_CHECK_ID: ${{ needs.pre.outputs.check_id }}
      RELEASE_PRE: ${{ needs.pre.result }}
      RELEASE_SUITE: ${{ needs.suite.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }} # trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: still staging
        id: verify
        # a failure caused by a newer commit's deployment cancels the run (neither a pass nor a red failure for this commit),
        # while a failure with this commit still current stays red
        if: ${{ needs.suite.result == 'success' || needs.suite.result == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent/gate.mjs release-verify
      - name: report
        # completes the verdict exactly once, computed here: success only if pre, the suite and the supersession check all succeeded,
        # cancelled if anything was cancelled, failure otherwise; a run
        # already completed as neutral (superseded, nothing to certify) is left as it is
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERIFY: ${{ steps.verify.outcome }}
        run: node scripts/agent/gate.mjs release-report
