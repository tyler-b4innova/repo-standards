# Managed by the standards pack: the one required check, job `gate`. Only code changes start it: a pull
# request's commits (opened, synchronize, reopened, ready_for_review), the merge queue, and a `workflow_dispatch`
# the org launcher sends after a base change (gate then tests the fresh merge ref). Comments, reviews and edits start
# nothing: the org rulesets require every review thread resolved, and scripts/agent/review.mjs is the conversation's
# rule for whatever merges (a launcher or merge helper). A draft is not gated: the job is skipped (nothing billed)
# and named `draft (not gated)`, so no `gate` check exists on a draft head. Iterate with `gate.mjs local`;
# ready_for_review runs the one full gate.
# The whole gate is one job, because the runner bills every job rounded up to a whole minute: the checks steps, then
# the test steps (a full plan on a ready head only), then the verdict step, which reads the outcomes of those steps.
# This workflow restores the dependency and browser caches and never saves them: a re-gate on the default branch runs a
# pull request's tree, so a cache written here could be seeded by that tree; std-cache-warm (main only) writes those.
# The one cache it saves is the pass-marker directory, under this pull request's own key, on a pull request or a re-gate
# dispatch only (never a release check, a full selection or a merge queue run): the markers of the units that passed.
# Repo-owned checks go in scripts/agent/gate.local.sh (it builds whatever it needs). The job's timeout is the overlay's
# gate.timeout_minutes.
name: std-gate
# The launcher parses a pull_request run's name: `gate pr=<n> base=<ref> head=<40-hex sha>` (GitHub can return an empty
# pull_requests[] on a same-repo run); other events keep GitHub's default name.
run-name: ${{ github.event_name == 'pull_request' && format('gate pr={0} base={1} head={2}', github.event.pull_request.number, github.base_ref, github.event.pull_request.head.sha) || '' }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request to re-gate on its fresh merge ref (the org launcher sends this after a base change)"
        required: true
permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  issues: read
concurrency:
  # a description edit and a draft-payload run (all jobs skipped) each have their own group, so neither can cancel the full gate
  # of a ready run: a push to a draft, then ready_for_review seconds later, creates both runs and their order is not guaranteed
  group: std-gate-${{ github.event.pull_request.number || inputs.pr || github.ref }}${{ github.event.action == 'edited' && '-edit' || '' }}${{ github.event.pull_request.draft == true && '-draft' || '' }}
  cancel-in-progress: true
jobs:
  gate:
    # A draft is not gated: the job is skipped and named `draft (not gated)`, so no check named `gate` exists on a draft
    # head, and a pull request flipped to ready without a full run has nothing to merge on. A run cancelled by a newer one
    # in its group stops here and runs no verdict, so it posts no failing `gate`.
    name: ${{ github.event.pull_request.draft == true && 'draft (not gated)' || 'gate' }}
    if: github.event.pull_request.draft != true
    # The runner is an org variable, so an org can move gate to another pool (and back) without a pack release.
    runs-on: ${{ vars.STD_GATE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: {gate_timeout_minutes}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr && format('refs/pull/{0}/merge', inputs.pr) || '' }}
          fetch-depth: 0
          persist-credentials: false
      - name: merge ref
        if: failure() && inputs.pr
        run: echo "::error::refs/pull/${{ inputs.pr }}/merge is missing, so the pull request conflicts with its new base; resolve the conflict and push"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # the dependency cache below is an explicit restore (this workflow never writes caches)
      - name: plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent/gate.mjs plan
      - name: standards
        env:
          ROLLBACK_BASE: ${{ steps.plan.outputs.rollback_base }}
          ROLLBACK_DRAFT: ${{ steps.plan.outputs.rollback_draft }}
        run: scripts/agent/setup.sh --check
      - name: instructions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent/gate.mjs instructions
      - name: secrets
        run: node scripts/agent/gate.mjs secrets
      # the last checks step: the verdict reads its outcome (a step after a failed one never runs)
      - name: syntax
        id: syntax
        run: node scripts/agent/gate.mjs syntax
      # the test steps run for a full plan on a ready head only; each one is also skipped after a failed step before it
      - name: package manager
        id: pm
        if: steps.plan.outputs.mode == 'full' && steps.plan.outputs.rollback_draft != 'true'
        # the lockfile's package manager caches (pnpm and yarn run through corepack; no cache if that fails)
        run: |
          if [ -f pnpm-lock.yaml ]; then if corepack enable && pnpm --version >/dev/null; then echo cache=pnpm >>"$GITHUB_OUTPUT"; echo "path=$(pnpm store path --silent)" >>"$GITHUB_OUTPUT"; fi
          elif [ -f yarn.lock ]; then if corepack enable && yarn --version >/dev/null; then echo cache=yarn >>"$GITHUB_OUTPUT"; echo "path=$(yarn cache dir 2>/dev/null || yarn config get cacheFolder)" >>"$GITHUB_OUTPUT"; fi
          elif [ -f package-lock.json ]; then echo cache=npm >>"$GITHUB_OUTPUT"; echo "path=$(npm config get cache)" >>"$GITHUB_OUTPUT"; fi
      - name: dependency cache
        if: steps.plan.outputs.mode == 'full' && steps.plan.outputs.rollback_draft != 'true' && steps.pm.outputs.cache != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pm.outputs.path }}
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.pm.outputs.cache }}-${{ hashFiles('package-lock.json', 'pnpm-lock.yaml', 'yarn.lock') }}
      - name: install
        if: steps.plan.outputs.mode == 'full' && steps.plan.outputs.rollback_draft != 'true'
        run: node scripts/agent/gate.mjs install --no-browsers
      # browsers are cached by the exact Playwright version and this run's browsers: a hit downloads nothing, and
      # system packages are installed only when the browsers' shared libraries are missing
      - name: playwright
        id: pw
        if: steps.plan.outputs.mode == 'full' && steps.plan.outputs.rollback_draft != 'true'
        env:
          GATE_BROWSERS: ${{ steps.plan.outputs.browsers }}
        run: node scripts/agent/gate.mjs playwright
      - name: browser cache
        if: steps.plan.outputs.mode == 'full' && steps.plan.outputs.rollback_draft != 'true' && steps.pw.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw.outputs.key }}
      - name: browsers
        if: steps.plan.outputs.mode == 'full' && steps.plan.outputs.rollback_draft != 'true' && steps.pw.outputs.key != ''
        env:
          GATE_BROWSERS: ${{ steps.plan.outputs.browsers }}
        run: node scripts/agent/gate.mjs install --browsers-only
      - name: typecheck
        if: steps.plan.outputs.mode == 'full' && steps.plan.outputs.rollback_draft != 'true'
        run: node scripts/agent/gate.mjs run typecheck
      - name: build
        if: steps.plan.outputs.mode == 'full' && steps.plan.outputs.rollback_draft != 'true'
        env:
          ROLLBACK_BASE: ${{ steps.plan.outputs.rollback_base }}
          ROLLBACK_DRAFT: ${{ steps.plan.outputs.rollback_draft }}
        run: node scripts/agent/gate.mjs run build
      # pass markers: a file named <unit>-<fingerprint> that the repo checks write for a unit that passed. Restored by this
      # pull request's key prefix (the latest run's markers only), exposed to gate.local.sh as STD_PASS_DIR, and saved
      # after the repo checks, pass or fail, under this run's key. Only a pull request or a re-gate dispatch gets them:
      # a release check, a full selection (GATE_SELECT=full) and a merge queue run test every unit, so STD_PASS_DIR is unset
      - name: pass markers
        if: steps.plan.outputs.mode == 'full' && steps.plan.outputs.rollback_draft != 'true' && (github.event_name == 'pull_request' || inputs.pr)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/std-pass
          key: std-pass-${{ github.event.pull_request.number || inputs.pr }}-${{ github.run_id }}
          restore-keys: std-pass-${{ github.event.pull_request.number || inputs.pr }}-
      - name: pass markers dir
        if: steps.plan.outputs.mode == 'full' && steps.plan.outputs.rollback_draft != 'true' && (github.event_name == 'pull_request' || inputs.pr)
        run: mkdir -p "$RUNNER_TEMP/std-pass" && echo "STD_PASS_DIR=$RUNNER_TEMP/std-pass" >>"$GITHUB_ENV"
      - name: repo checks
        if: steps.plan.outputs.mode == 'full' && steps.plan.outputs.rollback_draft != 'true'
        run: |
          if [ -f scripts/agent/gate.local.sh ]; then env -u RELEASE_CHECK bash scripts/agent/gate.local.sh; else echo "notice: no scripts/agent/gate.local.sh"; fi
      - name: pass markers save
        # after the repo checks whatever their outcome: the markers of the units that passed are kept when another unit failed
        if: ${{ always() && steps.plan.outputs.mode == 'full' && steps.plan.outputs.rollback_draft != 'true' && (github.event_name == 'pull_request' || inputs.pr) }}
        continue-on-error: true # a save that fails (a re-run of the same run has the key already) must not fail the gate
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/std-pass
          key: std-pass-${{ github.event.pull_request.number || inputs.pr }}-${{ github.run_id }}
      # last before e2e, so the Workers Builds for this head has the earlier steps' time to finish
      - name: preview
        id: preview
        if: steps.plan.outputs.mode == 'full' && steps.plan.outputs.rollback_draft != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent/gate.mjs preview
      - name: e2e
        id: e2e
        if: steps.plan.outputs.mode == 'full' && steps.plan.outputs.rollback_draft != 'true'
        env:
          GATE_BROWSERS: ${{ steps.plan.outputs.browsers }}
          GATE_PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: node scripts/agent/gate.mjs e2e
      # the verdict: a failed or skipped checks or test part fails the job; a cancelled run (!cancelled()) runs no verdict
      - name: verdict
        if: ${{ !cancelled() }}
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          LIVE_DRAFT: ${{ steps.plan.outputs.rollback_draft }}
          CHECKS: ${{ steps.syntax.outcome }}
          TEST: ${{ steps.e2e.outcome }}
        run: node scripts/agent/gate.mjs verdict
