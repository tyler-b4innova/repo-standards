# Managed by the standards pack: the one required check, job `gate`.
# Repo-owned checks go in scripts/agent/gate.local.sh. Review and comment events re-run this workflow's
# pull_request run through std-gate-rerun.yml, so they never cancel a gate in flight.
name: std-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited] # edited: a base change re-evaluates the diff
  merge_group:
  push:
    branches: [main, staging, "standards/v*"]
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: std-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: standards
        run: scripts/agent/setup.sh --check
      - name: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent/gate.mjs evidence
      - name: secrets
        run: node scripts/agent/gate.mjs secrets
      - name: install
        run: node scripts/agent/gate.mjs install
      - name: typecheck
        run: node scripts/agent/gate.mjs run typecheck
      - name: build
        run: node scripts/agent/gate.mjs run build
      - name: e2e
        run: node scripts/agent/gate.mjs e2e
      - name: repo checks
        run: |
          if [ -f scripts/agent/gate.local.sh ]; then bash scripts/agent/gate.local.sh; else echo "notice: no scripts/agent/gate.local.sh"; fi
      - name: codex review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/agent/gate.mjs codex
