# Managed by the standards pack, shipped only to repositories with a cloud-env.json (and an org overlay that names the
# cloud-env action, rendered below). Not a required check. A cloud-env.json change on a pull request runs the offline
# check (schema and consistency) with no token. A push to main, the production branch, applies the file with the
# Cloudflare token read from the org's CI 1Password vault (the overlay's cloud_env.token_ref, through the org secret
# OP_SERVICE_ACCOUNT_TOKEN); while that reference is unset it only posts a notice. A staged repository's integration
# branch only checks: cloud changes go live through the promotion. A manual run checks, and on main also applies (a
# cloud-env.json that predates this workflow is onboarded that way). Agents never hold this token.
name: std-cloud-env
on:
  pull_request:
    paths: [cloud-env.json]
  push:
    branches: [main]
    paths: [cloud-env.json]
  workflow_dispatch:
permissions:
  contents: read
# Every run that can apply (a push or a manual run) queues in one repository-wide group, never cancelled; a pull
# request's check has its own group, which a newer push to it cancels.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('std-cloud-env-pr-{0}', github.ref) || format('cloud-env-apply-{0}', github.repository) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cloud-env:
    runs-on: ${{ vars.STD_GATE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: settings
        id: cfg
        run: node -e 'console.log("token_ref="+(require("./scripts/agent/pack.json").cloud_env?.token_ref??""))' >>"$GITHUB_OUTPUT"
      - name: check
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: {cloud_env_action}
        with:
          args: --check --offline
      - name: token
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.cfg.outputs.token_ref != ''
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ steps.cfg.outputs.token_ref }}
      - name: apply
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.cfg.outputs.token_ref != ''
        uses: {cloud_env_action}
      - name: inert
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.cfg.outputs.token_ref == ''
        run: echo "::notice::cloud-env.json was not applied; the org overlay sets no cloud_env.token_ref yet"
